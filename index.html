*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.9;font-size:16px}
html[lang="fr"] body{line-height:1.7}
h1,h2,h3{font-family:'Amiri','Traditional Arabic',serif;margin:0}
html[lang="fr"] h1,html[lang="fr"] h2,html[lang="fr"] h3{font-family:'Cairo',Georgia,serif;font-weight:700}
.hero{background:linear-gradient(rgba(8,30,20,.78),rgba(10,60,38,.70)),var(--flag) center/cover no-repeat;color:#fff;text-align:center;padding:22px 16px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(90deg,#fff 0 33%,var(--red) 33% 66%,#0f5b3a 66%)}
.portrait{width:128px;height:128px;border-radius:50%;border:4px solid var(--gold);margin:0 auto 10px;background:#1b3d2c;overflow:hidden;display:block}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{font-size:clamp(24px,6vw,36px);line-height:1.5}
.hero p{margin:4px 0 0;opacity:.9;font-size:15px}
.hero .tools{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button,.btn{font-family:inherit;font-size:14px;cursor:pointer;border:0;border-radius:999px;padding:8px 16px;background:var(--gold);color:#1d1503;font-weight:700;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:6px;padding:8px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:var(--chip);color:var(--ink);white-space:nowrap;font-weight:600;padding:6px 14px}
nav button.on{background:var(--green);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
section{display:none;animation:f .3s}
section.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{font-size:28px;color:var(--green);margin:6px 0 12px;border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:2px}
html[lang="fr"] h2{font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card h3{font-size:21px;color:var(--green);margin-bottom:4px}
html[lang="fr"] .card h3{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.fact{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.fact b{display:block;color:var(--green);font-size:13px}
.fact span{font-size:15px;font-weight:700}
.tl{position:relative;padding-inline-start:22px;border-inline-start:3px solid var(--gold);margin-inline-start:6px}
.tl .it{position:relative;margin-bottom:14px}
.tl .it:before{content:"";position:absolute;inset-inline-start:-30px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.tl .y{font-weight:700;color:var(--red)}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px;margin:10px 0}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:0 10px;font-size:12px;margin-inline-end:4px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.gal img,.gal svg.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.gal figcaption{font-size:12px;padding:6px 8px;color:var(--muted)}
.gal .del{position:absolute;top:4px;inset-inline-start:4px;background:rgba(0,0,0,.6);color:#fff;padding:0 8px;font-size:16px}
.audio{display:flex;flex-direction:column;gap:6px}
.audio audio{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q{font-weight:700;margin-bottom:6px}
.opt{display:block;width:100%;text-align:start;background:var(--chip);color:var(--ink);border-radius:10px;margin:5px 0;font-weight:600}
.opt.ok{background:#1f8a54;color:#fff}.opt.no{background:var(--red);color:#fff}
.share{text-align:center}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:10px 0}
.link{direction:ltr;word-break:break-all;background:var(--chip);padding:8px;border-radius:8px;font-size:13px;text-align:left}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:150}
#lb.on{display:flex}#lb img{max-width:96%;max-height:92%;border-radius:8px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 18px;border-radius:999px;font-size:14px;display:none;z-index:160}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 14px 28px}
.big{font-family:'Amiri',serif;font-size:19px;color:var(--green);border-inline-start:4px solid var(--gold);padding:4px 12px;margin:10px 0;background:var(--chip);border-radius:8px}
html[lang="fr"] .big{font-family:'Cairo',serif;font-size:16px;font-style:italic}

/* Cover */
#cover{position:fixed;inset:0;z-index:100;overflow-y:auto;background:linear-gradient(rgba(6,24,16,.80),rgba(6,24,16,.90)),var(--flag) center/cover no-repeat;color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .45s,transform .45s}
#cover.out{opacity:0;transform:scale(1.04);pointer-events:none}
#cover .frame{width:100%;max-width:560px;margin:auto;border:2px solid var(--gold);border-radius:18px;padding:18px 16px 22px;background:rgba(0,0,0,.18);position:relative}
#cover .frame:before{content:"";position:absolute;inset:6px;border:1px solid rgba(217,174,85,.45);border-radius:13px;pointer-events:none}
#cover .rep{font-family:'Amiri',serif;font-size:17px;line-height:1.7;color:#f3e3b5}
html[lang="fr"] #cover .rep{font-family:'Cairo',serif;font-size:14px}
#cover .rep b{display:block;font-size:19px;color:#fff}
html[lang="fr"] #cover .rep b{font-size:15px}
#cover .school{font-size:14px;opacity:.92;margin-top:6px}
#cover .bar{height:5px;width:150px;margin:12px auto;background:linear-gradient(90deg,#fff 0 33%,#b3222d 33% 66%,#0f9d5a 66%);border-radius:3px}
#cover .cp{width:120px;height:120px;border-radius:50%;border:4px solid var(--gold);margin:6px auto 8px;overflow:hidden;background:#1b3d2c}
#cover .cp img{width:100%;height:100%;object-fit:cover;display:block}
#cover .mag{font-size:14px;color:var(--gold);margin-top:4px}
#cover h1{font-family:'Amiri',serif;font-size:clamp(26px,7vw,38px);line-height:1.5;margin:2px 0 4px}
html[lang="fr"] #cover h1{font-family:'Cairo',serif;font-size:clamp(22px,6vw,32px)}
#cover .sub{font-size:14px;opacity:.85}
#cover .info{margin:16px auto 6px;display:grid;gap:8px;text-align:start}
#cover .info div{background:rgba(255,255,255,.08);border-radius:10px;padding:7px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
#cover .info b{color:var(--gold);font-weight:600;white-space:nowrap}
#cover .info span{text-align:end;font-weight:700}
#cover .enter{margin-top:16px;font-size:17px;padding:11px 34px;animation:pul 2s infinite}
#cover .langtop{align-self:flex-end;margin-bottom:6px}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(217,174,85,.55)}50%{box-shadow:0 0 0 10px rgba(217,174,85,0)}}
.flagfoot{width:96px;height:60px;margin:0 auto 10px;border-radius:8px;border:2px solid var(--gold);background:var(--flag) center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.25)}
nav{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#fff 0 33%,var(--red) 33% 66%,#0f9d5a 66%) 1}
#fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:14px;z-index:40;width:48px;height:48px;border-radius:50%;padding:0;font-size:22px;background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35);border:2px solid var(--gold)}
#fab.on{animation:pul 2.2s infinite}
#cover .hint{margin-top:10px;font-size:12.5px;color:#f3e3b5;opacity:.9}

html[dir="rtl"]{--d:1}html[dir="ltr"]{--d:-1}
nav .mnu{position:sticky;inset-inline-start:0;z-index:2;background:var(--green);color:#fff;font-size:18px;padding:4px 14px}
.menu-hero{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:12px;width:42px;height:42px;padding:0;border-radius:12px;font-size:22px;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.5);z-index:3}
#drawer{position:fixed;inset:0;z-index:120;display:none}
#drawer.on{display:block}
#drawer .dbg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#drawer .dp{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(310px,86vw);background:var(--card);overflow-y:auto;padding:0 0 20px;animation:sl .25s ease;box-shadow:0 0 24px rgba(0,0,0,.4)}
@keyframes sl{from{transform:translateX(calc(var(--d)*100%))}to{transform:none}}
.dh{background:linear-gradient(rgba(8,30,20,.8),rgba(10,60,38,.75)),var(--flag) center/cover;color:#fff;text-align:center;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 14px;position:relative}
.dh img{width:72px;height:72px;border-radius:50%;border:3px solid var(--gold);object-fit:cover}
.dh b{display:block;font-size:15px;margin-top:6px;line-height:1.5}
.dh .x{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-end:8px;background:rgba(255,255,255,.2);color:#fff;width:34px;height:34px;padding:0;font-size:18px}
.mi{display:flex;width:100%;gap:12px;align-items:center;text-align:start;background:transparent;color:var(--ink);border-radius:0;padding:11px 18px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}
.mi.on{background:var(--chip);color:var(--green)}
.mi .ic{width:26px;text-align:center;font-size:18px}
.mi.act{color:var(--green)}
.msep{font-size:12px;color:var(--muted);padding:12px 18px 4px}
.bigi{display:block;width:calc(100% - 28px);margin:14px 14px 4px;padding:13px 10px;font-size:16px;background:linear-gradient(90deg,#b3222d,#d4333f);color:#fff;border-radius:14px;box-shadow:0 3px 10px rgba(179,34,45,.4);animation:pul 2.4s infinite}
#instModal{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#instModal.on{display:flex}
#instModal .box{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%;border:2px solid var(--gold)}
.speech{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:18px 18px 14px;position:relative}
.speech .badge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:2px 14px;font-size:13px;font-weight:700;margin-bottom:8px}
.speech h3{font-size:22px;color:var(--green);margin:4px 0 10px;line-height:1.6}
.speech .bsm{text-align:center;font-family:'Amiri',serif;font-size:22px;color:var(--green);margin:6px 0}
html[lang="fr"] .speech .bsm{font-family:'Cairo',serif;font-size:17px}
.speech p{margin:0 0 10px;text-align:justify}
.speech .verse{font-family:'Amiri',serif;font-size:21px;color:var(--green);text-align:center;background:var(--chip);border-radius:10px;padding:8px 10px;margin:8px 0;line-height:2}
html[lang="fr"] .speech .verse{font-family:'Cairo',serif;font-size:16px;font-style:italic}
.speech .poem{text-align:center;font-family:'Amiri',serif;font-size:20px;line-height:2;margin:6px 0 10px;color:var(--ink)}
html[lang="fr"] .speech .poem{font-family:'Cairo',serif;font-size:16px;font-style:italic}
.speech .sign{border-top:1px dashed var(--line);margin-top:12px;padding-top:8px;font-weight:700;color:var(--muted);font-size:14px;text-align:center}
.speech .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}

</section>

 intro:{facts:[['الاسم','زكريا بن سليمان'],['الميلاد','12 جوان 1908'],['مكان الميلاد','بني يزقن، غرداية'],['الوفاة','17 أوت 1977'],['لقبه','شاعر الثورة']],
  ps:['مفدي زكريا شاعر جزائري من إقليم وادي ميزاب، وُلد في مدينة بني يزقن بولاية غرداية. اشتهر بأنه صوت الثورة التحريرية الجزائرية، وارتبط اسمه بنشيد «قسماً» الذي صار النشيد الوطني للجزائر المستقلة. و«مفدي» اسم أدبي اختاره لنفسه، ومعناه الذي يفدي وطنه.','جمع في شعره بين الجزالة الكلاسيكية وروح الملحمة والحماسة، وكان شعره سلاحاً في معركة الهوية والاستقلال، فعُرف بالشاعر الذي «سُجن وشُرّد من أجل كلمته».'],
  quote:'«الشعر عند مفدي موقف قبل أن يكون فناً»',
  note:'ملاحظة: تختلف بعض التواريخ والتفاصيل الدقيقة بين المصادر؛ يُنصح بمراجعة الكتب والمراجع الموثوقة عند البحث الأكاديمي.'},
 edu:[['الطفولة','الكُتّاب وحفظ القرآن','بدأ تعليمه في مسقط رأسه بني يزقن، فتعلم القرآن الكريم ومبادئ اللغة العربية والعلوم الدينية على يد شيوخ المنطقة.'],['العشرينيات','الانتقال إلى الشمال ثم تونس','تنقل بين مدن جزائرية قبل أن يتوجه إلى تونس طلباً للعلم، حيث درس في المدرسة الخلدونية ثم جامع الزيتونة، وتعمّق في الأدب العربي والشعر القديم.'],['أثر التكوين','تأثره بروّاد الإصلاح','عاش أجواء الحركة الوطنية والإصلاحية في تونس والجزائر، فتشكل وعيه القومي والأدبي، وبرزت موهبته الشعرية مبكراً.']],
 work:[['الصحافة والكتابة','كتب في عدد من الصحف والمجلات الوطنية والعربية، ونشر مقالاته وقصائده، وكانت الصحافة منبره الأول للتعريف بقضايا الجزائر.'],['الطباعة والنشر','اشتغل في مجال الطباعة والنشر، وكان له دور في طبع ونشر الأعمال الأدبية والوطنية في فترات من حياته.'],['بعد الاستقلال','عاد إلى الجزائر المستقلة، وواصل الكتابة، وأنجز ملحمته الكبرى «إلياذة الجزائر» التي خلّد فيها تاريخ البلاد وجغرافيتها وأمجادها.']],
 act:[['الثلاثينيات','الانخراط في الحركة الوطنية','التحق بالحركة الوطنية المطالبة بالاستقلال: نجم شمال إفريقيا ثم حزب الشعب الجزائري، وكتب أناشيد حماسية للحزب.'],['1937 وما بعدها','السجن والملاحقة','تعرض للاعتقال أكثر من مرة بسبب نشاطه السياسي وكتاباته، وتعرّض للتضييق على حريته.'],['1954 – 1962','مع الثورة التحريرية','انضم إلى صفوف جبهة التحرير الوطني، وأصبح لسانها الشعري في الداخل والخارج. كتب «قسماً» عام 1955 في سجن بربروس (سركاجي) بالعاصمة، ثم لحّنها الموسيقار المصري محمد فوزي.'],['أثناء الثورة','المنفى والنضال بالكلمة','تنقل بين المغرب وتونس وبلدان عربية أخرى، وكان يدافع عن القضية الجزائرية في المحافل بشعره.'],['1963','نشيد وطني','اعتُمد «قسماً» نشيداً وطنياً للجزائر المستقلة.']],
 books:{grid:[['اللهب المقدس','ديوانه الأشهر في الثورة، جمع فيه قصائد الكفاح والمنفى والسجن والبطولة.'],['تحت ظلال الزيتون','ديوان يضم قصائد من مرحلة مبكرة ومن مراحل الحركة الوطنية.'],['من وحي الأطلس','ديوان يجمع قصائد في الوطن والطبيعة والتاريخ.'],['إلياذة الجزائر','ملحمة شعرية طويلة، نظمها بعد الاستقلال، تسرد تاريخ الجزائر عبر العصور.']],

  verseIntro:'قال الله تعالى:',verse:'﴿يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ﴾.',poetIntro:'وقال أمير الشعراء أحمد شوقي:',poem:['قم للمعلم وفّه التبجيلا','كاد المعلم أن يكون رسولا'],
  body:['وبهذه المناسبة السعيدة والغالية، أتقدم إلى كل مربٍّ ومربية، وكل معلم ومعلمة، وكل أستاذ وأستاذة، بمناسبة عيدهم العالمي، بأسمى عبارات الشكر والعرفان والتقدير؛ لمربي الأجيال، وصانعي العقول، وبناة الإنسان والأوطان.','ألف شكر، وألف تحية على ما بذلتموه وتبذلونه في سبيل تعليم وتربية الناشئة، وعلى جهودكم ونضالكم في محاربة الجهل ونشر العلم، وعلى رسالتكم النبيلة في بناء جيل صالح، متعلم، واعٍ، متمسك بقيمه ومبادئه.','أنتم أيها المربون حراس الثغور، ومشاعل النور؛ تحاربون الجهل، وتنشرون العلم، وتحاربون الرذيلة، وتغرسون الفضيلة.','وفي الحقيقة، مهما قلت ومهما عبّرت، فلن أوفيكم حقكم، وستظل الكلمات عاجزة عن وصف فضلكم وعظيم رسالتكم؛ فجزاكم الله عن أبنائنا وبناتنا خير الجزاء، وجعل كل حرف علّمتموه، وكل جهد بذلتموه، وكل أثر طيب تركتموه، في ميزان حسناتكم.','وفي الختام، أسأل الله تعالى أن يبارك فيكم، وفي صحتكم وأولادكم وأرزاقكم، وأن يوفقكم في أداء رسالتكم النبيلة، وأن يجزيكم خير الجزاء، ويرزقكم جوار سيدنا محمد صلى الله عليه وسلم، ويدخلكم جنات الرضوان.','عيد معلم سعيد ومبارك لكل معلم ومعلمة، وكل عام وأنتم بخير وعطاء.','والسلام عليكم ورحمة الله تعالى وبركاته.'],

 intro:{facts:[['Nom','Zakaria ben Slimane'],['Naissance','12 juin 1908'],['Lieu de naissance','Beni Isguen, Ghardaïa'],['Décès','17 août 1977'],['Surnom','Poète de la Révolution']],
  ps:['Moufdi Zakaria est un poète algérien originaire de la vallée du M’zab, né à Beni Isguen (wilaya de Ghardaïa). Il est surtout connu comme la voix de la Révolution algérienne, et son nom reste lié à « Kassaman », devenu l’hymne national de l’Algérie indépendante. « Moufdi » est un nom de plume qui signifie « celui qui se sacrifie pour sa patrie ».','Sa poésie allie la noblesse du style classique au souffle de l’épopée et de l’enthousiasme. Elle fut une arme dans le combat pour l’identité et l’indépendance : on l’a appelé le poète emprisonné et exilé pour ses vers.'],
  quote:'« Chez Moufdi, la poésie est une prise de position avant d’être un art »',
  note:'Remarque : certaines dates et détails varient selon les sources ; consultez des ouvrages de référence fiables pour un travail de recherche.'},
 edu:[['Enfance','L’école coranique','Il commence ses études à Beni Isguen, sa ville natale, où il apprend le Coran, les bases de la langue arabe et des sciences religieuses auprès des maîtres de la région.'],['Années 1920','Du nord de l’Algérie à Tunis','Après quelques étapes dans des villes algériennes, il part étudier à Tunis : il fréquente l’école Khaldounia puis la mosquée Zitouna et approfondit la littérature et la poésie arabes classiques.'],['Formation','L’influence des réformateurs','Il vit l’effervescence du mouvement national et réformiste en Tunisie et en Algérie, qui forge sa conscience nationale et littéraire ; son talent poétique apparaît tôt.']],
 work:[['Journalisme et écriture','Il écrit dans plusieurs journaux et revues algériens et arabes, publie articles et poèmes, et la presse devient sa première tribune pour faire connaître la cause de l’Algérie.'],['Imprimerie et édition','Il a travaillé dans l’imprimerie et l’édition et contribué, à certaines périodes de sa vie, à la publication d’œuvres littéraires et patriotiques.'],['Après l’indépendance','De retour dans l’Algérie indépendante, il continue d’écrire et achève sa grande épopée, « L’Iliade de l’Algérie », où il célèbre l’histoire, la géographie et la gloire du pays.']],
 act:[['Années 1930','Entrée dans le mouvement national','Il rejoint le mouvement national réclamant l’indépendance : l’Étoile nord-africaine, puis le Parti du peuple algérien, pour lequel il compose des chants enthousiastes.'],['Dès 1937','Prison et poursuites','Il est arrêté à plusieurs reprises en raison de son activité politique et de ses écrits, et sa liberté est constamment entravée.'],['1954 – 1962','Avec la Révolution de libération','Il rejoint le Front de libération nationale (FLN) et devient sa voix poétique en Algérie et à l’étranger. Il écrit « Kassaman » en 1955 à la prison de Barberousse (Serkadji), à Alger ; la musique est du compositeur égyptien Mohamed Fawzi.'],['Pendant la Révolution','Exil et combat par la plume','Il circule entre le Maroc, la Tunisie et d’autres pays arabes, défendant par ses vers la cause algérienne.'],['1963','Hymne national','« Kassaman » est adopté comme hymne national de l’Algérie indépendante.']],
 books:{grid:[['Le Feu sacré (Al-Lahab al-Muqaddas)','Son recueil le plus célèbre sur la Révolution : poèmes de lutte, d’exil, de prison et d’héroïsme.'],['À l’ombre des oliviers','Recueil de poèmes de ses débuts et de l’époque du mouvement national.'],['Inspiré de l’Atlas','Recueil de poèmes sur la patrie, la nature et l’histoire.'],['L’Iliade de l’Algérie','Longue épopée composée après l’indépendance, qui raconte l’histoire de l’Algérie à travers les siècles.']],
  traitsH:'Caractéristiques de sa poésie',tags:['Arabe classique soutenu','Souffle épique','Fierté de l’identité','Poésie des grandes occasions','Engagement révolutionnaire'],traitsP:'Il suit la métrique et la forme de la poésie arabe classique, en l’associant à des thèmes nouveaux : la Révolution, les martyrs et la résistance.',
  note:'Les titres sont donnés à titre d’information ; les dates d’édition peuvent varier selon les éditeurs et les sources.'},
 death:['Moufdi Zakaria meurt le 17 août 1977 à Tunis. Sa dépouille est ramenée en Algérie et inhumée dans sa ville natale, Beni Isguen. Il disparaît après avoir vu son rêve d’indépendance se réaliser, et son hymne continue d’être chanté à chaque cérémonie nationale.','Aujourd’hui, des écoles, des rues et des institutions culturelles d’Algérie portent son nom, et sa mémoire est célébrée chaque année lors de rencontres littéraires.'],

/* ===================== INDEXEDDB ===================== */
let dbp=null;
function db(){
  if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{
    try{const r=indexedDB.open('mufdi',1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('photos',{keyPath:'id',autoIncrement:true});d.createObjectStore('audio',{keyPath:'key'})};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}
  });return dbp;
}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}

/* ===================== GALLERY ===================== */
let blobURLs=[];
function openLb(u){$('#lb img').src=u;$('#lb').classList.add('on')}
async function renderGallery(){
  const t=T(),g=$('#galGrid');blobURLs.forEach(URL.revokeObjectURL);blobURLs=[];
  let list=[];try{list=await tx('photos','readonly',s=>s.getAll())||[]}catch(e){}
  g.innerHTML='';
  const all=[{s:DEFAULT_PHOTO,c:t.galMain}].concat(ALBUM.map(a=>({s:a.s,c:a[lang]})));
  all.forEach(a=>{const f=document.createElement('figure');
    f.innerHTML=`<img alt="" loading="lazy" src="${a.s}"><figcaption>${a.c}</figcaption>`;
    f.querySelector('img').onclick=()=>openLb(a.s);g.appendChild(f)});
  list.forEach(p=>{
    const u=URL.createObjectURL(p.blob);blobURLs.push(u);
    const f=document.createElement('figure');
    f.innerHTML=`<img alt="" src="${u}"><button class="del" title="×">×</button><figcaption>${(p.name||'').replace(/[<>]/g,'')}</figcaption>`;
    f.querySelector('img').onclick=()=>openLb(u);
    f.querySelector('.del').onclick=async()=>{try{await tx('photos','readwrite',s=>s.delete(p.id))}catch(e){}renderGallery();loadPortrait()};
    g.appendChild(f);
  });
}
$('#lb').onclick=()=>$('#lb').classList.remove('on');
$('#addPhoto').onclick=()=>$('#photoIn').click();
$('#photoIn').onchange=async e=>{
  for(const f of e.target.files){try{await tx('photos','readwrite',s=>s.add({blob:f,name:f.name}))}catch(err){toast(T().t_saveFail)}}
  e.target.value='';renderGallery();loadPortrait();toast(T().t_added);
};
let portraitURL=null;
async function loadPortrait(){
  try{const l=await tx('photos','readonly',s=>s.getAll())||[];
    if(portraitURL)URL.revokeObjectURL(portraitURL);
    const pick=l.find(x=>x.portrait);
    if(pick){portraitURL=URL.createObjectURL(pick.blob);setPortrait(portraitURL)}else setPortrait(null)}catch(e){setPortrait(null)}
}
$('#setPortrait').onclick=async()=>{
  try{const l=await tx('photos','readonly',s=>s.getAll())||[];
    if(!l.length){toast(T().t_first);return}
    for(const p of l){p.portrait=(p===l[0]);await tx('photos','readwrite',s=>s.put(p))}
    loadPortrait();toast(T().t_portrait);
  }catch(e){toast(T().t_saveFail)}
};

/* ===================== ANTHEM (background audio) ===================== */
const bg=new Audio();bg.loop=true;bg.preload='auto';bg.volume=.7;
let bgWanted=true,srcs=[],si=0,srcsReady=false,userURL=null,failed=false;
try{if(localStorage.getItem('bgmute')==='1')bgWanted=false}catch(e){}
async function initSrcs(){
  srcs=[];si=0;failed=false;
  if(userURL){URL.revokeObjectURL(userURL);userURL=null}
  try{const r=await tx('audio','readonly',s=>s.get('bg'));if(r&&r.blob){userURL=URL.createObjectURL(r.blob);srcs.push(userURL)}}catch(e){}
  srcs.push('audio/kassaman.ogg','https://commons.wikimedia.org/wiki/Special:FilePath/Kassaman_instrumental.ogg');
  bg.src=srcs[0];srcsReady=true;
}
bg.addEventListener('error',()=>{
  si++;
  if(si<srcs.length){bg.src=srcs[si];if(bgWanted)bg.play().catch(()=>{})}
  else if(!failed){failed=true;toast(T().a_missing)}
});
function fabUpdate(){const f=$('#fab');const p=!bg.paused;f.textContent=p?'🔊':'🔇';f.classList.toggle('on',p);f.title=T().fabLbl;f.setAttribute('aria-label',T().fabLbl);renderAnthemCard()}
bg.addEventListener('play',fabUpdate);bg.addEventListener('pause',fabUpdate);
async function startAnthem(){
  if(!bgWanted)return;
  if(!srcsReady)await initSrcs();
  try{await bg.play()}catch(e){if(!failed)toast(T().a_tap);armTap()}
}
let armed=false;
function armTap(){
  if(armed)return;armed=true;
  const h=()=>{armed=false;removeEventListener('pointerdown',h,true);if(bgWanted&&bg.paused)bg.play().catch(()=>{})};
  addEventListener('pointerdown',h,true);
}
async function toggleAnthem(){
  if(!srcsReady)await initSrcs();
  if(bg.paused){bgWanted=true;try{localStorage.setItem('bgmute','0')}catch(e){}try{await bg.play()}catch(e){toast(T().a_missing)}}
  else{bgWanted=false;try{localStorage.setItem('bgmute','1')}catch(e){}bg.pause()}
}
$('#fab').onclick=toggleAnthem;
function renderAnthemCard(){
  const t=T(),c=$('#anthCard');if(!c)return;
  c.innerHTML=`<h3>${t.anthH}</h3><p>${t.anthP}</p><div class="row"><button id="anthTog">${bg.paused?t.anthOff:t.anthOn}</button><button class="ghost" id="anthPick" style="color:var(--green)">${t.anthPick}</button><button class="ghost" id="anthReset" style="color:var(--green)">${t.anthReset}</button><input type="file" id="anthIn" accept="audio/*" hidden></div><p style="margin-top:10px;font-size:13px">${t.srcP}</p><div class="row">${t.srcLinks.slice(0,2).map(l=>`<a class="btn ghost" style="color:var(--green)" target="_blank" rel="noopener" href="${l[1]}">${l[0]}</a>`).join('')}</div><div class="note">${t.srcNote}</div>`;
  $('#anthTog').onclick=toggleAnthem;
  $('#anthPick').onclick=()=>$('#anthIn').click();
  $('#anthIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{await tx('audio','readwrite',s=>s.put({key:'bg',blob:f}));await initSrcs();bgWanted=true;try{localStorage.setItem('bgmute','0')}catch(x){}toast(T().a_saved);bg.play().catch(()=>{})}catch(err){toast(T().t_saveFail)}};
  $('#anthReset').onclick=async()=>{try{await tx('audio','readwrite',s=>s.delete('bg'))}catch(e){}await initSrcs();toast(T().a_reset);if(bgWanted)bg.play().catch(()=>{})};
}
function renderAnthem(){fabUpdate()}

/* ===================== QUIZ ===================== */
let qi=0,sc=0;
function renderQ(){
  const t=T(),Q=t.quiz,b=$('#quizBox');
  if(qi>=Q.length){b.innerHTML=`<div class="card"><h3>${t.score}: ${sc} ${t.of} ${Q.length}</h3><p>${sc>=6?t.g1:sc>=4?t.g2:t.g3}</p><button id="again">${t.again}</button></div>`;
    $('#again').onclick=()=>{qi=0;sc=0;renderQ()};return}
  const [q,o,a]=Q[qi];
  b.innerHTML=`<div class="card"><div class="tag">${t.qn} ${qi+1} / ${Q.length}</div><div class="q">${q}</div></div>`;
  const c=b.firstChild;let done=false;
  o.forEach((txt,i)=>{const x=document.createElement('button');x.className='opt';x.textContent=txt;
    x.onclick=()=>{if(done)return;done=true;if(i===a){sc++;x.classList.add('ok')}else{x.classList.add('no');c.querySelectorAll('.opt')[a].classList.add('ok')}
      const n=document.createElement('button');n.textContent=qi===Q.length-1?t.result:t.next;n.style.marginTop='8px';n.onclick=()=>{qi++;renderQ()};c.appendChild(n)};
    c.appendChild(x)});
}

/* ===================== SHARE / QR / INSTALL ===================== */
const url=location.href.split('#')[0];
$('#lnk').textContent=url;
try{new QRCode($('#qr'),{text:url,width:200,height:200,colorDark:'#0f2a1d',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qr').textContent=T().qrFail}
async function doShare(){
  const t=T(),d={title:t.shareTitle,text:t.shareText,url};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(url);toast(t.t_copied)}catch(e){go('shareSec')}}
}
$('#btnShare').onclick=doShare;$('#share2').onclick=doShare;
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast(T().t_copied)}catch(e){toast(T().t_manual)}};
$('#dlQr').onclick=()=>{
  const c=$('#qr canvas'),i=$('#qr img');const src=c?c.toDataURL('image/png'):(i&&i.src);
  if(!src){toast(T().t_na);return}
  const a=document.createElement('a');a.href=src;a.download='mufdi-zakaria-qr.png';a.click();
};
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
addEventListener('appinstalled',()=>{toast(T().t_inst);deferred=null});
$('#btnInstall').onclick=installApp;

/* ===================== MENU / INSTALL HELP / TEACHER DAY ===================== */
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function installApp(){
  if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}
  else if(isStandalone()){toast(T().t_already)}
  else showInstallHelp();
}
function showInstallHelp(){
  const t=T();closeMenu();
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const main=ios?`🍏 ${t.instIOS}`:`🤖 ${t.instAnd}`;
  const other=ios?`<p style="font-size:13px;color:var(--muted)">🤖 ${t.instAnd}</p>`:`<p style="font-size:13px;color:var(--muted)">🍏 ${t.instIOS}</p>`;
  $('#instBox').innerHTML=`<h3 style="color:var(--green);margin-bottom:6px">${t.instTitle}</h3><p style="font-weight:700">${main}</p>${other}<div class="note">${t.instNote}</div><div class="row" style="justify-content:center"><button id="imGo">${t.instGo}</button><button class="ghost" id="imX" style="color:var(--green)">${t.instClose}</button></div>`;
  $('#instModal').classList.add('on');
  $('#imX').onclick=()=>$('#instModal').classList.remove('on');
  $('#imGo').onclick=()=>{$('#instModal').classList.remove('on');go('shareSec')};
}
async function saveCopy(){
  try{
    toast(T().t_dl);
    const r=await fetch(location.href.split('#')[0]);
    if(!r.ok)throw 0;
    const b=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mufdi-zakaria-app.html';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){toast(T().t_dlFail)}
}
$('#instModal').onclick=e=>{if(e.target.id==='instModal')$('#instModal').classList.remove('on')};
if(isStandalone()){$('#btnInstall').style.display='none'}

const ICONS={intro:'👤',teacher:'🍎',edu:'🎓',work:'💼',act:'🚩',books:'📚',death:'🕊️',poems:'📜',gallery:'🖼️',videos:'🎬',quiz:'🧠',shareSec:'📲'};
function openMenu(){renderMenu();$('#drawer').classList.add('on')}
function closeMenu(){$('#drawer').classList.remove('on')}
$('#menuHero').onclick=openMenu;
$('#drawer .dbg').onclick=closeMenu;
function renderMenu(){
  const t=T(),p=$('#dp');if(!p)return;
  const items=ids.map((id,i)=>`<button class="mi ${id===current?'on':''}" data-go="${id}"><span class="ic">${ICONS[id]}</span>${t.nav[i]}</button>`).join('');
  const acts=[];
  acts.push(['share','↗',t.mShare],['lang','🌐',t.langBtn],['theme','◐',t.mTheme],['anth','🎵',t.mAnth],['file','💾',t.mFile]);
  p.innerHTML=`<div class="dh"><button class="x" id="dClose" aria-label="${t.mClose}">✕</button><img alt="" src="${userPortrait||DEFAULT_PHOTO}"><b>${t.title}</b></div>${isStandalone()?'':`<button class="bigi" id="bigInstall">${t.mBig}</button>`}<div class="msep">${t.mSec}</div>${items}<div class="msep">${t.mAct}</div>${acts.map(a=>`<button class="mi act" data-act="${a[0]}"><span class="ic">${a[1]}</span>${a[2]}</button>`).join('')}`;
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeMenu();go(b.dataset.go)});
  p.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='install'){closeMenu();installApp()}
    else if(a==='share'){closeMenu();doShare()}
    else if(a==='lang'){closeMenu();toggleLang()}
    else if(a==='theme'){$('#btnTheme').click()}
    else if(a==='anth'){toggleAnthem()}
    else if(a==='file'){saveCopy()}
  });
  $('#dClose').onclick=closeMenu;
  const bi=$('#bigInstall');if(bi)bi.onclick=()=>{closeMenu();installApp()};
}

let speaking=false;
function speechText(){const k=T().teacher;return [k.head,k.basmala,k.salat].concat(k.addr,[k.verseIntro,k.verse,k.poetIntro],k.poem,k.body,k.sign).join('\n')}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false;const b=$('#spkBtn');if(b)b.textContent=T().teacher.listen}
function renderTeacher(){
  const k=T().teacher,box=$('#b_teacher');if(!box)return;
  box.innerHTML=`<div class="speech"><span class="badge">${k.badge}</span><h3>${k.head}</h3>
  <div class="bsm">${k.basmala}</div><p style="text-align:center">${k.salat}</p>
  ${k.addr.map(a=>`<p>${a}</p>`).join('')}
  <p>${k.verseIntro}</p><div class="verse">${k.verse}</div>
  <p>${k.poetIntro}</p><div class="poem">${k.poem.map(l=>`<div>${l}</div>`).join('')}</div>
  ${k.body.map(a=>`<p>${a}</p>`).join('')}
  <div class="sign">${k.sign.map(s=>`<div>${s}</div>`).join('')}</div>
  <div class="tools"><button id="cpBtn">${k.copy}</button>${('speechSynthesis' in window)?`<button class="ghost" id="spkBtn" style="color:var(--green)">${k.listen}</button>`:''}</div></div>`;
  $('#cpBtn').onclick=async()=>{try{await navigator.clipboard.writeText(speechText());toast(k.copied)}catch(e){toast(T().t_manual)}};
  const sb=$('#spkBtn');
  if(sb)sb.onclick=()=>{
    if(speaking){stopSpeak();return}
    try{const u=new SpeechSynthesisUtterance(speechText());u.lang=lang==='ar'?'ar-SA':'fr-FR';u.onend=stopSpeak;u.onerror=stopSpeak;speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;sb.textContent=k.stop}catch(e){stopSpeak()}
  };
}

/* ===================== COVER ===================== */
(function(){
  const cv=$('#cover');
  document.body.style.overflow='hidden';
  $('#enterBtn').onclick=()=>{
    cv.classList.add('out');document.body.style.overflow='';startAnthem();
    try{sessionStorage.setItem('entered','1')}catch(e){}
    setTimeout(()=>cv.remove(),500);
  };
  try{if(sessionStorage.getItem('entered')){cv.remove();document.body.style.overflow='';setTimeout(startAnthem,300)}}catch(e){}
})();

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

/* ===================== INIT ===================== */
setPortrait(null);
applyLang();
const h=(location.hash||'').slice(1);
go(ids.includes(h)?h:'intro');
loadPortrait();
})();
</script>
</body>
